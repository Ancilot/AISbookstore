# AdressDAO
adress.find_all = SELECT * FROM store.adress ORDER BY country, region, city
adress.find_by_id = SELECT * FROM store.adress WHERE id_adress = ?
adress.insert = INSERT INTO store.adress (country, region, city, street, house) VALUES (?, ?, ?, ?, ?) RETURNING id_adress
adress.update = UPDATE store.adress SET country = ?, region = ?, city = ?, street = ?, house = ? WHERE id_adress = ?
adress.delete = DELETE FROM store.adress WHERE id_adress = ?


# AuthorsDAO
authors.find_all = SELECT * FROM store.authors ORDER BY surname, name_author
authors.find_by_id = SELECT * FROM store.authors WHERE id_authors = ?
authors.insert = INSERT INTO store.authors (surname, name_author, patronymic) VALUES (?, ?, ?) RETURNING id_authors
authors.update = UPDATE store.authors SET surname = ?, name_author = ?, patronymic = ? WHERE id_authors = ?
authors.delete = DELETE FROM store.authors WHERE id_authors = ?
authors.search = SELECT * FROM store.search_authors(?)

# AuthorsBookDAO
authors_book.insert = INSERT INTO store.authors_book (author, book) VALUES (?, ?)
authors_book.delete_by_book = DELETE FROM store.authors_book WHERE book = ?
authors_book.delete_by_book_author = DELETE FROM store.authors_book WHERE book = ? AND author = ?
authors_book.find_by_book = SELECT a.* FROM store.authors_book ab JOIN store.authors a ON a.id_authors = ab.author WHERE ab.book = ?
authors_book.find_authors_not_in_book = SELECT * FROM store.authors a WHERE a.id_authors NOT IN (SELECT author FROM store.authors_book WHERE book = ?) ORDER BY a.surname, a.name_author

# GenresDAO
genres.find_all = SELECT * FROM store.genres ORDER BY genr
genres.find_by_id = SELECT * FROM store.genres WHERE id_genr = ?
genres.insert = INSERT INTO store.genres (genr) VALUES (?) RETURNING id_genr
genres.update = UPDATE store.genres SET genr = ? WHERE id_genr = ?
genres.delete = DELETE FROM store.genres WHERE id_genr = ?
genres.search = SELECT * FROM store.search_genres(?)

# GenresBookDAO
genres_book.insert = INSERT INTO store.genres_book (genr, book) VALUES (?, ?)
genres_book.delete_by_book = DELETE FROM store.genres_book WHERE book = ?
genres_book.delete_by_book_genre = DELETE FROM store.genres_book WHERE book = ? AND genr = ?
genres_book.find_by_book = SELECT g.* FROM store.genres_book gb JOIN store.genres g ON g.id_genr = gb.genr WHERE gb.book = ?
genres_book.find_genres_not_in_book = SELECT * FROM store.genres g WHERE g.id_genr NOT IN (SELECT genr FROM store.genres_book WHERE book = ?) ORDER BY g.genr

# BookCatalogDAO
book_catalog.find_all = SELECT b.id_book, b.name_book, b.isbn, b.year_publication, b.number_pages, b.annotation, p.name_publishing, p.id_pub, COALESCE((SELECT string_agg(DISTINCT g.genr, ', ') FROM store.genres_book gb JOIN store.genres g ON g.id_genr = gb.genr WHERE gb.book = b.id_book), '') AS genres, COALESCE((SELECT string_agg(DISTINCT a.surname || ' ' || a.name_author, ', ') FROM store.authors_book ab JOIN store.authors a ON a.id_authors = ab.author WHERE ab.book = b.id_book), '') AS authors, (SELECT price FROM store.price WHERE id_books = b.id_book ORDER BY date_time DESC LIMIT 1) AS price, (SELECT quantity FROM store.warehouse WHERE book = b.id_book LIMIT 1) AS quantity FROM store.book_catalog b LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses ORDER BY b.id_book

book_catalog.find_by_id = SELECT b.id_book, b.name_book, b.isbn, b.year_publication, b.number_pages, b.annotation, p.name_publishing, p.id_pub FROM store.book_catalog b LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses WHERE b.id_book = ?

book_catalog.insert = INSERT INTO store.book_catalog (name_book, publishing_houses, year_publication, isbn, number_pages, annotation) VALUES (?, ?, ?, ?, ?, ?) RETURNING id_book

book_catalog.update = UPDATE store.book_catalog SET name_book = ?, publishing_houses = ?, year_publication = ?, isbn = ?, number_pages = ?, annotation = ? WHERE id_book = ?

book_catalog.delete = DELETE FROM store.book_catalog WHERE id_book = ?

book_catalog.search = SELECT * FROM store.search_books(?)

#  ClientsDAO
clients.find_all_active = SELECT * FROM store.clients WHERE archiv IS NOT TRUE ORDER BY surname, name_client
clients.find_all_archive = SELECT * FROM store.clients WHERE archiv = TRUE ORDER BY surname, name_client
clients.find_by_id = SELECT * FROM store.clients WHERE id_client = ?
clients.insert = INSERT INTO store.clients (surname, name_client, patrontmic, number_client, email) VALUES (?, ?, ?, ?, ?) RETURNING id_client
clients.update = UPDATE store.clients SET surname = ?, name_client = ?, patrontmic = ?, number_client = ?, email = ? WHERE id_client = ?
clients.search = SELECT * FROM store.clients WHERE archiv IS NOT TRUE AND (surname ILIKE ? OR name_client ILIKE ? OR patrontmic ILIKE ?) ORDER BY surname, name_client
clients.delete = { ? = call store.delete_client(?) }

# WarehouseDAO
warehouse.find_all_active = SELECT w.id_warehouse, w.book, w.quantity, w.status, b.name_book, b.isbn, b.year_publication, p.name_publishing FROM store.warehouse w JOIN store.book_catalog b ON b.id_book = w.book LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses WHERE w.archiv IS NOT TRUE ORDER BY b.name_book

warehouse.find_all_archive = SELECT w.id_warehouse, w.book, w.quantity, w.status, b.name_book, b.isbn, b.year_publication, p.name_publishing FROM store.warehouse w JOIN store.book_catalog b ON b.id_book = w.book LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses WHERE w.archiv = TRUE ORDER BY b.name_book

warehouse.find_books_not_in_warehouse = SELECT b.id_book, b.name_book, b.isbn, b.year_publication, p.name_publishing, COALESCE(string_agg(DISTINCT a.surname || ' ' || a.name_author, ', '), '') AS authors FROM store.book_catalog b LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses LEFT JOIN store.authors_book ab ON ab.book = b.id_book LEFT JOIN store.authors a ON a.id_authors = ab.author WHERE NOT EXISTS (SELECT 1 FROM store.warehouse w WHERE w.book = b.id_book) GROUP BY b.id_book, b.name_book, b.isbn, b.year_publication, p.name_publishing ORDER BY b.name_book

warehouse.insert = INSERT INTO store.warehouse (book, quantity) VALUES (?, ?) RETURNING id_warehouse

warehouse.search_active = SELECT w.id_warehouse, w.book, w.quantity, w.status, b.name_book, b.isbn, b.year_publication, p.name_publishing FROM store.warehouse w JOIN store.book_catalog b ON b.id_book = w.book LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses WHERE w.archiv IS NOT TRUE AND b.name_book ILIKE ? ORDER BY b.name_book

warehouse.search_archive = SELECT w.id_warehouse, w.book, w.quantity, w.status, b.name_book, b.isbn, b.year_publication, p.name_publishing FROM store.warehouse w JOIN store.book_catalog b ON b.id_book = w.book LEFT JOIN store.publishing_houses p ON p.id_pub = b.publishing_houses WHERE w.archiv = TRUE AND b.name_book ILIKE ? ORDER BY b.name_book

warehouse.search_for_sale = SELECT * FROM store.search_warehouse(?)
warehouse.delete_book = { ? = call store.delete_book(?) }

# OrdersDAO
orders.find_all_active = SELECT o.*, c.surname, c.name_client, c.patrontmic, b.name_book FROM store.orders o LEFT JOIN store.clients c ON c.id_client = o.client LEFT JOIN store.book_catalog b ON b.id_book = o.book WHERE o.archiv IS NOT TRUE ORDER BY o.date_order DESC

orders.search = SELECT o.*, c.surname, c.name_client, c.patrontmic, b.name_book FROM store.orders o LEFT JOIN store.clients c ON c.id_client = o.client LEFT JOIN store.book_catalog b ON b.id_book = o.book WHERE o.archiv IS NOT TRUE AND (c.surname ILIKE ? OR c.name_client ILIKE ? OR b.name_book ILIKE ? OR o.status ILIKE ?) ORDER BY o.date_order DESC

orders.insert = INSERT INTO store.orders (client, book, quanity, text_order) VALUES (?, ?, ?, ?) RETURNING id_order
orders.complete = { call store.complete_order(?) }
orders.delete = { ? = call store.delete_order(?) }

# ChecksDAO
checks.insert = INSERT INTO store.checks (client, sum_check) VALUES (?, 0) RETURNING id_check
checks.find_by_id = SELECT * FROM store.checks WHERE id_check = ?
checks.complete = { call store.complete_check(?) }
checks.delete = DELETE FROM store.checks WHERE id_check = ?

# CompositionCheckDAO
composition_check.insert = INSERT INTO store.composition_check (checks, book, quantity) VALUES (?, ?, ?) RETURNING id_composition
composition_check.delete_by_id = DELETE FROM store.composition_check WHERE id_composition = ?
composition_check.delete_by_check_book = DELETE FROM store.composition_check WHERE checks = ? AND book = ?
composition_check.delete_by_check = DELETE FROM store.composition_check WHERE checks = ?
composition_check.find_by_check = SELECT cc.*, b.name_book, b.isbn, c.date_time, c.status, COALESCE((SELECT string_agg(DISTINCT a.surname || ' ' || a.name_author, ', ') FROM store.authors_book ab JOIN store.authors a ON a.id_authors = ab.author WHERE ab.book = b.id_book), '') AS authors, COALESCE((SELECT string_agg(DISTINCT g.genr, ', ') FROM store.genres_book gb JOIN store.genres g ON g.id_genr = gb.genr WHERE gb.book = b.id_book), '') AS genres FROM store.composition_check cc JOIN store.book_catalog b ON b.id_book = cc.book JOIN store.checks c ON c.id_check = cc.checks WHERE cc.checks = ?

composition_check.find_by_client = SELECT cc.*, b.name_book, b.isbn, c.date_time, c.status, COALESCE((SELECT string_agg(DISTINCT a.surname || ' ' || a.name_author, ', ') FROM store.authors_book ab JOIN store.authors a ON a.id_authors = ab.author WHERE ab.book = b.id_book), '') AS authors, COALESCE((SELECT string_agg(DISTINCT g.genr, ', ') FROM store.genres_book gb JOIN store.genres g ON g.id_genr = gb.genr WHERE gb.book = b.id_book), '') AS genres FROM store.composition_check cc JOIN store.book_catalog b ON b.id_book = cc.book JOIN store.checks c ON c.id_check = cc.checks WHERE c.client = ? ORDER BY c.date_time DESC

composition_check.search_details = SELECT * FROM store.search_check_details(?, ?)
composition_check.update_quantity = UPDATE store.composition_check SET quantity = ? WHERE id_composition = ?
composition_check.find_by_id = SELECT * FROM store.composition_check WHERE id_composition = ?
composition_check.find_by_check_book = SELECT * FROM store.composition_check WHERE checks = ? AND book = ?
composition_check.count_by_check = SELECT COUNT(*) FROM store.composition_check WHERE checks = ?

# Stored Procedures
sp.reserve_book_stock = { call store.reserve_book_stock(?, ?) }
sp.return_book_stock = { call store.return_book_stock(?, ?) }
sp.update_reserved_stock = { call store.update_reserved_stock(?, ?, ?) }
sp.return_from_check = { call store.return_from_check(?, ?) }

# PublishingHousesDAO
publishing_houses.find_all = SELECT * FROM store.publishing_houses ORDER BY name_publishing
publishing_houses.find_by_id = SELECT ph.*, a.country, a.region, a.city, a.street, a.house FROM store.publishing_houses ph LEFT JOIN store.adress a ON a.id_adress = ph.adress WHERE ph.id_pub = ?
publishing_houses.insert = INSERT INTO store.publishing_houses (name_publishing, adress, number_publishing, email) VALUES (?, ?, ?, ?) RETURNING id_pub
publishing_houses.update = UPDATE store.publishing_houses SET name_publishing = ?, adress = ?, number_publishing = ?, email = ? WHERE id_pub = ?
publishing_houses.delete = DELETE FROM store.publishing_houses WHERE id_pub = ?

# SuppliersDAO
suppliers.find_all = SELECT * FROM store.suppliers ORDER BY name_supplier
suppliers.find_by_id = SELECT * FROM store.suppliers WHERE id_supplier = ?

# InvoiceDAO
invoice.insert = INSERT INTO store.invoice (supplier, warehouse, date_invoice, quanity, price) VALUES (?, ?, ?, ?, ?) RETURNING id_invoice
invoice.find_all = SELECT i.*, s.name_supplier, w.book FROM store.invoice i LEFT JOIN store.suppliers s ON s.id_supplier = i.supplier LEFT JOIN store.warehouse w ON w.id_warehouse = i.warehouse ORDER BY i.date_invoice DESC

